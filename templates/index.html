<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Alarm Help</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="app-shell">
    <header class="activity-card card" aria-live="polite">
        <strong>Alarm Activity</strong>
        <time id="activity-time">—</time>
        <span id="activity-name">Waiting for alarm activity…</span>
        <span id="activity-state" class="state-badge">—</span>
    </header>

    <section id="workspace" class="workspace history-collapsed">
        <aside id="history-sidebar" class="history-sidebar card" aria-label="Recent Alarm History">
            <div class="panel-heading">
                <h2>Recent Alarm History</h2>
                <button id="open-pareto" type="button">Pareto</button>
                <button id="refresh-history" type="button">Refresh History</button>
                <button id="close-history" type="button" aria-controls="history-sidebar" aria-expanded="false" title="Close history">◀ Close</button>
            </div>
            <p id="history-status" class="muted">No alarm history</p>
            <div id="history-scroll" class="history-scroll" tabindex="0" aria-label="Alarm history">
                <table>
                    <thead><tr><th>Time</th><th>Tag Name</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
                <button id="load-older" type="button">Load older alarms</button>
            </div>
        </aside>

        <button id="open-history" class="open-history" type="button" aria-controls="history-sidebar" aria-expanded="false" title="Open recent alarm history">▶ <span>History</span></button>

        <article class="detail-card card">
            <div class="detail-toolbar">
                <div class="latest-navigation">
                    <p id="newer-alarm" class="newer hidden">Newer alarm available</p>
                    <button id="back-latest" class="hidden" type="button">Back to Latest Alarm</button>
                </div>
                <div class="refresh-controls">
                    <button id="refresh-latest" type="button">Refresh Latest</button>
                    <label for="auto-refresh">Auto-refresh</label>
                    <select id="auto-refresh">
                        <option value="0">Off</option>
                        <option value="5">5 sec</option>
                        <option value="10" selected>10 sec</option>
                        <option value="30">30 sec</option>
                    </select>
                </div>
            </div>
            <section id="pareto-panel" class="hidden" aria-label="Alarm Pareto">
                <div class="panel-heading"><h2 id="pareto-title">Alarm Pareto - Last 24 Hours</h2>
                <label>Time frame <select id="pareto-window"><option value="24h">24 Hours</option><option value="48h">48 Hours</option><option value="1w">1 Week</option><option value="1m">1 Month</option></select></label>
                <button id="back-alarm" type="button">Back to Alarm</button></div>
                <p id="pareto-status" role="status"></p>
                <div id="pareto-chart" class="pareto-scroll"></div>
                <div class="pareto-scroll"><table class="pareto-table"><thead><tr><th>Tag Name / Kepware Path</th><th>Count</th><th>Percentage</th><th>Cumulative %</th></tr></thead><tbody id="pareto-body"></tbody></table></div>
            </section>
            <p id="detail-status" class="muted">Loading latest alarm…</p>
            <div id="detail-content" class="hidden">
                <div id="knowledge" class="knowledge"></div>
            </div>
        </article>
    </section>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
